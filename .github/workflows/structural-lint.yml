name: Structural Reference Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structural-lint:
    name: structural-reference-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository references and persistence conventions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path('.')
          errors = []
          path_re = re.compile(r'`([^`]+)`')
          resolution_roots = [
              pathlib.Path('.'),
              pathlib.Path('core'),
              pathlib.Path('systems'),
              pathlib.Path('realms'),
              pathlib.Path('factions'),
              pathlib.Path('events'),
              pathlib.Path('custom'),
              pathlib.Path('lore'),
              pathlib.Path('gm'),
              pathlib.Path('characters'),
              pathlib.Path('story'),
              pathlib.Path('audits'),
          ]

          # Only concrete repository file/directory references are checked.
          # Template/schema references remain documentation and are skipped.
          refs = []
          for md in root.rglob('*.md'):
              if '.git' in md.parts:
                  continue
              text = md.read_text(encoding='utf-8')
              for match in path_re.finditer(text):
                  ref = match.group(1).strip()
                  if ref.startswith(('http://', 'https://')):
                      continue
                  if any(x in ref for x in ('<', '>', '[', ']', '...', '*', '####')):
                      continue
                  if any(ch.isspace() for ch in ref):
                      continue
                  if not (ref.endswith('.md') or ref.endswith('/')):
                      continue
                  if ref.startswith(('./', '../')):
                      continue
                  refs.append((md, ref))

          for source, ref in refs:
              clean_ref = ref.rstrip('/')
              candidates = []
              # Prefer source-relative references, then canonical repository roots.
              candidates.append(source.parent / clean_ref)
              for base in resolution_roots:
                  candidate = base / clean_ref
                  if candidate not in candidates:
                      candidates.append(candidate)
              if not any(target.exists() for target in candidates):
                  errors.append(f'MISSING_REFERENCE: {source.as_posix()} -> {ref}')

          # Canonical Character identity/path consistency.
          registry = root / 'characters/character_registry.md'
          if not registry.exists():
              errors.append('MISSING_REGISTRY: characters/character_registry.md')
          else:
              text = registry.read_text(encoding='utf-8')
              ids = re.findall(r'^### (CHAR-\d+)$', text, re.M)
              states = re.findall(r'Current State:\s*`characters/players/(CHAR-\d+)\.md`', text)
              if sorted(ids) != sorted(states):
                  errors.append(f'CHARACTER_REGISTRY_MISMATCH: ids={ids} states={states}')
              for cid in ids:
                  state = root / f'characters/players/{cid}.md'
                  if not state.exists():
                      errors.append(f'MISSING_CHARACTER_STATE: {cid} -> {state.as_posix()}')

          # Player -> Character references must resolve to registered Character IDs.
          player_registry = root / 'characters/players.md'
          if player_registry.exists() and registry.exists():
              ptext = player_registry.read_text(encoding='utf-8')
              ctext = registry.read_text(encoding='utf-8')
              registered_chars = set(re.findall(r'^### (CHAR-\d+)$', ctext, re.M))
              for cid in re.findall(r'Character(?:\(s\)|s)?:\s*(CHAR-\d+)', ptext):
                  if cid not in registered_chars:
                      errors.append(f'PLAYER_CHARACTER_ORPHAN: {cid}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          print(f'OK: checked {len(refs)} concrete Markdown path references.')
          print('OK: character registry/current-state identity conventions are consistent.')
          print('OK: player-to-character registry references are consistent.')
          PY
