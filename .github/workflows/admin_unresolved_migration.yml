name: Admin Canon — Remove Legacy Unknown Marker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace legacy marker
        shell: bash
        run: |
          set -euo pipefail
          files=$(git grep -Il '???' -- '*.md' '*.txt' '*.yaml' '*.yml' || true)
          if [ -z "$files" ]; then
            echo "No legacy unknown markers found."
            exit 0
          fi
          while IFS= read -r file; do
            sed -i 's/???/UNRESOLVED/g' "$file"
          done <<< "$files"

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TianDao Admin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add -A
          git commit -m "Admin audit: replace legacy unknown marker"
          git push
